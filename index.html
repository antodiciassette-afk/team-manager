<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Team Manager"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Team Manager</title><style>
:root{--b:#2563eb;--bg:#f5f7fb;--c:#fff;--t:#172033;--m:#667085;--l:#e4e7ec;--g:#15803d;--o:#c2410c;--r:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}header{padding:calc(22px + env(safe-area-inset-top)) 18px 20px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff}h1{margin:0;font-size:23px}header p{margin:4px 0 0;opacity:.85;font-size:13px}main{max-width:620px;margin:auto;padding:16px}.page{display:none}.page.active{display:block}h2{font-size:19px;margin:3px 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.stat{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:10px}.stat span,.meta{font-size:12px;color:var(--m)}.stat b{display:block;font-size:25px;margin-top:4px}.avatar{width:40px;height:40px;border-radius:50%;background:#dbeafe;color:var(--b);display:grid;place-items:center;font-weight:800;flex:none}.person{display:flex;align-items:center;gap:10px}.badge{font-size:11px;font-weight:700;padding:5px 8px;border-radius:99px}.ok{background:#dcfce7;color:var(--g)}.warn{background:#ffedd5;color:var(--o)}.bad{background:#fee2e2;color:var(--r)}button,input,select{font:inherit}button{cursor:pointer}.primary,.secondary,.danger{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.primary{background:var(--b);color:#fff}.secondary{background:#dbeafe;color:#1d4ed8}.danger{background:#fee2e2;color:var(--r)}.small{padding:7px 9px;font-size:12px}.full{width:100%}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}input,select{width:100%;border:1px solid #cfd4dc;border-radius:11px;padding:12px;background:#fff;color:var(--t)}.check{width:34px;height:34px;border:2px solid #b8c0cc;border-radius:10px;background:#fff;color:#fff;font-weight:900}.check.on{background:var(--g);border-color:var(--g)}nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--l);padding:7px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:transparent;color:var(--m);font-size:11px;padding:6px 2px}nav button b{display:block;font-size:20px}nav button.active{color:var(--b);font-weight:800}dialog{width:min(92%,460px);border:0;border-radius:18px;padding:18px}dialog::backdrop{background:#0008}.actions{display:flex;gap:8px;margin-top:14px}.empty{text-align:center;color:var(--m);padding:28px 10px}.notice{background:#ffedd5;color:var(--o);padding:10px 12px;border-radius:12px;font-size:12px;margin-bottom:12px}.progress{height:7px;background:#edf0f4;border-radius:8px;overflow:hidden;margin-top:8px}.bar{height:100%;background:var(--g)}@media(prefers-color-scheme:dark){:root{--bg:#101828;--c:#182230;--t:#f2f4f7;--m:#98a2b3;--l:#344054}input,select,.check{background:#101828;color:#fff;border-color:#475467}nav{background:#182230}}
</style></head><body><header><h1>Team Manager</h1><p>Presenze, ingressi e pagamenti</p></header><main>
<section class="page active" id="home"><h2>Panoramica</h2><div class="grid" id="stats"></div><button class="primary full" onclick="openTraining()">+ Nuovo allenamento</button><h2 style="margin-top:20px">Da controllare</h2><div id="alerts"></div></section>
<section class="page" id="trainings"><div class="row"><h2>Allenamenti</h2><button class="primary small" onclick="openTraining()">+ Nuovo</button></div><div id="trainingList"></div></section>
<section class="page" id="players"><div class="row"><h2>Giocatori</h2><button class="primary small" onclick="playerDlg.showModal()">+ Aggiungi</button></div><input id="search" placeholder="Cerca nome o cognome" oninput="renderPlayers()"><div id="playerList" style="margin-top:12px"></div></section>
<section class="page" id="payments"><h2>Pacchetti e pagamenti</h2><div id="paymentList"></div><div class="toolbar"><button class="secondary full" onclick="exportData()">Esporta backup</button><label class="secondary full" style="text-align:center;margin:0;padding:11px 14px;border-radius:12px;cursor:pointer">Importa backup<input type="file" accept="application/json" onchange="importData(event)" hidden></label></div></section>
</main><nav><button class="active" onclick="go('home',this)"><b>⌂</b>Home</button><button onclick="go('trainings',this)"><b>✓</b>Allenamenti</button><button onclick="go('players',this)"><b>♟</b>Giocatori</button><button onclick="go('payments',this)"><b>€</b>Pagamenti</button></nav>
<dialog id="playerDlg"><form onsubmit="addPlayer(event)"><h2>Nuovo giocatore</h2><label>Nome</label><input id="first" required maxlength="40"><label>Cognome</label><input id="last" required maxlength="40"><div class="actions"><button type="button" class="secondary full" onclick="playerDlg.close()">Annulla</button><button class="primary full">Salva</button></div></form></dialog>
<dialog id="packageDlg"><form onsubmit="savePackage(event)"><h2>Assegna pacchetto</h2><input id="packagePlayer" type="hidden"><label>Ingressi</label><select id="packageSize"><option>5</option><option>10</option></select><label>Stato pagamento</label><select id="paid"><option value="true">Pagato</option><option value="false">Non pagato</option></select><div class="actions"><button type="button" class="secondary full" onclick="packageDlg.close()">Annulla</button><button class="primary full">Assegna</button></div></form></dialog>
<dialog id="trainingDlg"><form onsubmit="createTraining(event)"><h2>Nuovo allenamento</h2><label>Data</label><input id="date" type="date" required><label>Note</label><input id="note" maxlength="70"><div class="actions"><button type="button" class="secondary full" onclick="trainingDlg.close()">Annulla</button><button class="primary full">Crea</button></div></form></dialog>
<dialog id="attendanceDlg"><h2 id="attTitle">Presenze</h2><div class="notice">Seleziona i presenti. Un ingresso verrà scalato al salvataggio.</div><div id="attList"></div><div class="actions"><button class="secondary full" onclick="attendanceDlg.close()">Chiudi</button><button class="primary full" onclick="saveAttendance()">Salva</button></div></dialog>
<script>
const KEY='team-manager-v1';let db=load(),active=null,draft=[];function load(){try{return JSON.parse(localStorage.getItem(KEY))||{players:[],trainings:[],next:1}}catch(e){return{players:[],trainings:[],next:1}}}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b))}function initials(p){return(p.first[0]+p.last[0]).toUpperCase()}function state(p){return!p.total?['Nessun pacchetto','warn']:p.left===0?['Esaurito','bad']:p.left<=2?[p.left+' rimasti','warn']:[p.left+' rimasti','ok']}function render(){stats.innerHTML=`<div class="stat"><span>Giocatori</span><b>${db.players.length}</b></div><div class="stat"><span>Allenamenti</span><b>${db.trainings.length}</b></div><div class="stat"><span>Pacchetti in scadenza</span><b>${db.players.filter(p=>p.total&&p.left<=2).length}</b></div><div class="stat"><span>Non pagati</span><b>${db.players.filter(p=>p.total&&!p.paid).length}</b></div>`;let f=db.players.filter(p=>(p.total&&p.left<=2)||(p.total&&!p.paid));alerts.innerHTML=f.length?f.map(p=>`<div class="card row"><div><b>${esc(p.first)} ${esc(p.last)}</b><div class="meta">${!p.paid?'Pagamento mancante':'Pacchetto da rinnovare'}</div></div><span class="badge ${state(p)[1]}">${state(p)[0]}</span></div>`).join(''):'<div class="card">Tutto in regola.</div>';renderPlayers();renderPayments();renderTrainings()}function renderPlayers(){let q=search.value.toLowerCase(),a=db.players.filter(p=>(p.first+' '+p.last).toLowerCase().includes(q));playerList.innerHTML=a.length?a.map(p=>`<div class="card"><div class="row"><div class="person"><div class="avatar">${initials(p)}</div><div><b>${esc(p.first)} ${esc(p.last)}</b><div class="meta">${p.presences||0} presenze</div></div></div><span class="badge ${state(p)[1]}">${state(p)[0]}</span></div>${p.total?`<div class="progress"><div class="bar" style="width:${p.left/p.total*100}%"></div></div>`:''}<div class="toolbar"><button class="secondary small" onclick="openPackage(${p.id})">+ Pacchetto</button><button class="danger small" onclick="removePlayer(${p.id})">Elimina</button></div></div>`).join(''):'<div class="empty">Nessun giocatore.</div>'}function renderPayments(){paymentList.innerHTML=db.players.length?db.players.map(p=>`<div class="card row"><div class="person"><div class="avatar">${initials(p)}</div><div><b>${esc(p.first)} ${esc(p.last)}</b><div class="meta">${p.total?p.left+' di '+p.total+' ingressi':'Nessun pacchetto'}</div></div></div>${p.total?`<button class="badge ${p.paid?'ok':'bad'}" onclick="togglePaid(${p.id})">${p.paid?'Pagato':'Non pagato'}</button>`:`<button class="secondary small" onclick="openPackage(${p.id})">Assegna</button>`}</div>`).join(''):'<div class="empty">Aggiungi un giocatore.</div>'}function renderTrainings(){trainingList.innerHTML=db.trainings.length?db.trainings.map(t=>`<button class="card full" style="text-align:left" onclick="editAttendance(${t.id})"><b>${new Date(t.date+'T12:00').toLocaleDateString('it-IT')}</b><div class="meta">${t.present.length} presenti · ${esc(t.note||'Allenamento')}</div></button>`).join(''):'<div class="empty">Nessun allenamento.</div>'}function addPlayer(e){e.preventDefault();db.players.push({id:db.next++,first:first.value.trim(),last:last.value.trim(),total:0,left:0,paid:false,presences:0});e.target.reset();playerDlg.close();save()}function removePlayer(id){if(confirm('Eliminare il giocatore?')){db.players=db.players.filter(p=>p.id!==id);save()}}function openPackage(id){packagePlayer.value=id;packageDlg.showModal()}function savePackage(e){e.preventDefault();let p=db.players.find(x=>x.id==packagePlayer.value),n=+packageSize.value;p.total=n;p.left=n;p.paid=paid.value==='true';packageDlg.close();save()}function togglePaid(id){let p=db.players.find(x=>x.id===id);p.paid=!p.paid;save()}function openTraining(){if(!db.players.length)return alert('Aggiungi prima un giocatore.');date.value=new Date().toISOString().slice(0,10);trainingDlg.showModal()}function createTraining(e){e.preventDefault();let t={id:Date.now(),date:date.value,note:note.value.trim(),present:[]};db.trainings.unshift(t);trainingDlg.close();e.target.reset();save();editAttendance(t.id)}function editAttendance(id){active=id;let t=db.trainings.find(x=>x.id===id);draft=[...t.present];attTitle.textContent='Presenze del '+new Date(t.date+'T12:00').toLocaleDateString('it-IT');drawAttendance();attendanceDlg.showModal()}function drawAttendance(){attList.innerHTML=db.players.map(p=>`<div class="card row"><div><b>${esc(p.first)} ${esc(p.last)}</b><div class="meta">${p.left} ingressi disponibili</div></div><button class="check ${draft.includes(p.id)?'on':''}" onclick="toggleAttendance(${p.id})">${draft.includes(p.id)?'✓':''}</button></div>`).join('')}function toggleAttendance(id){draft=draft.includes(id)?draft.filter(x=>x!==id):[...draft,id];drawAttendance()}function saveAttendance(){let t=db.trainings.find(x=>x.id===active);db.players.forEach(p=>{let was=t.present.includes(p.id),now=draft.includes(p.id);if(now&&!was){p.presences++;if(p.left>0)p.left--}if(was&&!now){p.presences=Math.max(0,p.presences-1);if(p.total)p.left=Math.min(p.total,p.left+1)}});t.present=[...draft];attendanceDlg.close();save();alert('Presenze salvate.')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-team-manager.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.players)||!Array.isArray(d.trainings))throw 0;if(confirm('Sostituire i dati attuali con il backup?')){db=d;save()}}catch(x){alert('File di backup non valido.')}};r.readAsText(f);e.target.value=''}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
